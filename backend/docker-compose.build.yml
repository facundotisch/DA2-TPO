services:
  postgres:
    image: postgres:16.9-alpine3.21
    environment:
      POSTGRES_DB: logired
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logired"]
      interval: 2s
      timeout: 3s
      retries: 30
