spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/logired
spring.datasource.username=postgres
spring.datasource.password=12345

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.servlet.session.timeout=5m

# Ubicacion de demostracion del deposito central (CABA)
logired.deposito.default.nombre=Deposito central (demo)
logired.deposito.default.direccion=Av. 9 de Julio s/n, junto al Obelisco, CABA
logired.deposito.default.latitud=-34.6037
logired.deposito.default.longitud=-58.3816

# ==========================================
# CONFIGURACIÓN BROKER JMS (ActiveMQ)
# ==========================================
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.jms.listener.acknowledge-mode=auto
spring.jms.listener.session-transacted=true
spring.jms.listener.concurrency=1

# Habilita Publicación/Suscripción (Topic) en lugar de Punto a Punto (Queue)
spring.jms.pub-sub-domain=true

# Nombre del tópico de eventos de pedidos/envíos
logired.jms.topic.envios-creados=logired.envios.creados
logired.jms.queue.pedidos-creados=logired.pedidos.creados

# Integración REST con el sistema moderno. Vacío deshabilita la llamada externa.
logired.integraciones.rest.ruteo-url=http://localhost:8080/api/ruteo/optimizar
logired.integraciones.rest.timeout-millis=5000

# Gateway de IA compatible con API HTTP/OpenAI. Vacío deshabilita el proveedor externo.
logired.integraciones.ia.gateway-url=
logired.integraciones.ia.api-key=
logired.integraciones.ia.model=logired-gateway
logired.integraciones.ia.timeout-millis=5000

# Rate limiting de login por IP de origen
logired.auth.rate-limit.max-attempts=5
logired.auth.rate-limit.window-seconds=60