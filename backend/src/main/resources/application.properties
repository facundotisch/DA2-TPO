spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/logired
spring.datasource.username=postgres
spring.datasource.password=12345

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.servlet.session.timeout=5m

# Ubicacion de demostracion del deposito central (CABA)
logired.deposito.default.nombre=Deposito central (demo)
logired.deposito.default.direccion=Av. 9 de Julio s/n, junto al Obelisco, CABA
logired.deposito.default.latitud=-34.6037
logired.deposito.default.longitud=-58.3816

# ==========================================
# CONFIGURACIÓN BROKER JMS (ActiveMQ)
# ==========================================
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

# Habilita Publicación/Suscripción (Topic) en lugar de Punto a Punto (Queue)
spring.jms.pub-sub-domain=true

# Nombre del tópico de eventos de pedidos/envíos
logired.jms.topic.envios-creados=logired.envios.creados