spring.application.name=backend

# ==========================================
# PostgreSQL
# Las credenciales salen de variables de entorno: no hay contraseñas en el repositorio.
# Ver .env.example en la raíz del proyecto.
# ==========================================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logired}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:12345}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# No volcar SQL con datos de clientes al log.
spring.jpa.show-sql=false

# Server
server.port=8080
server.servlet.session.timeout=5m
# No se muestran stack traces ni mensajes internos en las respuestas de error.
server.error.include-stacktrace=never
server.error.include-message=never
# Cookie de sesión (holds de inventario): no accesible desde JavaScript ni enviada desde otros sitios.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Usuarios iniciales: solo se crean si se definen estas variables de entorno.
logired.seed.admin-password=${LOGIRED_ADMIN_PASSWORD:}
logired.seed.operador-password=${LOGIRED_OPERADOR_PASSWORD:}

# Ubicacion de demostracion del deposito central (CABA)
logired.deposito.default.nombre=Deposito central (demo)
logired.deposito.default.direccion=Av. 9 de Julio s/n, junto al Obelisco, CABA
logired.deposito.default.latitud=-34.6037
logired.deposito.default.longitud=-58.3816

# ==========================================
# BROKER JMS (ActiveMQ)
# Reintentos: 3 reentregas con espera creciente; después el mensaje va a ActiveMQ.DLQ.
# ==========================================
spring.activemq.broker-url=${ACTIVEMQ_URL:tcp://localhost:61616}?jms.redeliveryPolicy.maximumRedeliveries=3&jms.redeliveryPolicy.initialRedeliveryDelay=500&jms.redeliveryPolicy.useExponentialBackOff=true&jms.redeliveryPolicy.backOffMultiplier=2
spring.activemq.user=${ACTIVEMQ_USER:}
spring.activemq.password=${ACTIVEMQ_PASSWORD:}
spring.jms.listener.acknowledge-mode=auto
spring.jms.listener.session-transacted=true
spring.jms.listener.concurrency=1
spring.jms.pub-sub-domain=true

# true: si no hay un broker escuchando en localhost:61616, la app levanta uno embebido (desarrollo).
# En docker compose se pone en false y se usa el contenedor de ActiveMQ.
logired.jms.broker-embebido=${LOGIRED_JMS_BROKER_EMBEBIDO:true}

# Virtual Topic: cada suscriptor lee su propia cola persistente Consumer.<nombre>.VirtualTopic.logired.envios.creados
logired.jms.topic.envios-creados=VirtualTopic.logired.envios.creados

# Outbox: cada cuánto se publican en el broker los eventos pendientes.
logired.outbox.intervalo-ms=2000

# ==========================================
# Integraciones
# ==========================================
# Sistema moderno de ruteo (REST). Vacío: se usa siempre el ruteo local como fallback.
# En docker compose apunta al mock de WireMock.
logired.integraciones.rest.ruteo-url=${LOGIRED_RUTEO_URL:}
logired.integraciones.rest.timeout-millis=5000

# Gateway de IA compatible con API HTTP/OpenAI. Vacío: el asistente responde con el mensaje de respaldo.
logired.integraciones.ia.gateway-url=${LOGIRED_IA_GATEWAY_URL:}
logired.integraciones.ia.api-key=${LOGIRED_IA_API_KEY:}
logired.integraciones.ia.model=${LOGIRED_IA_MODEL:logired-gateway}
logired.integraciones.ia.timeout-millis=5000

# Rate limiting de login y Basic Auth por IP de origen
logired.auth.rate-limit.max-attempts=5
logired.auth.rate-limit.window-seconds=60
