name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build, tests y análisis estático
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial para el análisis de código nuevo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Ejecutar pruebas y cobertura
        run: ./build.sh
      - name: Análisis estático (SonarCloud)
        # Requiere los secretos SONAR_TOKEN y las variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY.
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true
      - name: Publicar reporte Jacoco
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

  seguridad:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks revisa todo el historial, no solo el último commit (G6)
      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Vulnerabilidades en dependencias (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  mutacion:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Paso nuevo: queda informativo hasta validar en CI la compatibilidad de PIT con la
    # versión de JUnit de Spring Boot 4. Después, quitar continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: PIT sobre el dominio de pedidos
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Publicar reporte PIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: backend/target/pit-reports/
          if-no-files-found: warn
