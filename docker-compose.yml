# Sistema completo con un solo comando (criterio G1):
#   cp .env.example .env   # y completar las contraseñas
#   docker compose up --build
#
# Servicios: base PostgreSQL, broker ActiveMQ, mock del sistema de ruteo (WireMock) y la app.
# Las contraseñas salen de .env, que no se versiona.

services:
  postgres:
    image: postgres:16.9-alpine3.21
    environment:
      POSTGRES_DB: logired
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d logired"]
      interval: 3s
      timeout: 3s
      retries: 30

  activemq:
    image: apache/activemq-classic:6.1.3
    environment:
      ACTIVEMQ_WEB_USER: ${ACTIVEMQ_WEB_USER:-admin}
      ACTIVEMQ_WEB_PASSWORD: ${ACTIVEMQ_WEB_PASSWORD:?Definí ACTIVEMQ_WEB_PASSWORD en .env}
    ports:
      - "127.0.0.1:61616:61616"  # OpenWire
      - "127.0.0.1:8161:8161"    # Consola web: ver y reprocesar ActiveMQ.DLQ
    volumes:
      - activemq-data:/opt/apache-activemq/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/61616'"]
      interval: 3s
      timeout: 3s
      retries: 40

  ruteo-mock:
    # Sistema moderno de ruteo simulado. Rutas:
    #   POST /ruteo/optimizar  -> respuesta válida
    #   POST /ruteo/lento      -> tarda 7 s (para probar el timeout de 5 s y el fallback)
    #   POST /ruteo/error      -> HTTP 503
    image: wiremock/wiremock:3.9.1
    volumes:
      - ./mocks/ruteo:/home/wiremock
    ports:
      - "127.0.0.1:8089:8080"

  app:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
      ruteo-mock:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/logired
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      ACTIVEMQ_URL: tcp://activemq:61616
      LOGIRED_JMS_BROKER_EMBEBIDO: "false"
      LOGIRED_RUTEO_URL: ${LOGIRED_RUTEO_URL:-http://ruteo-mock:8080/ruteo/optimizar}
      LOGIRED_ADMIN_PASSWORD: ${LOGIRED_ADMIN_PASSWORD:?Definí LOGIRED_ADMIN_PASSWORD en .env}
      LOGIRED_OPERADOR_PASSWORD: ${LOGIRED_OPERADOR_PASSWORD:?Definí LOGIRED_OPERADOR_PASSWORD en .env}
      LOGIRED_IA_GATEWAY_URL: ${LOGIRED_IA_GATEWAY_URL:-}
      LOGIRED_IA_API_KEY: ${LOGIRED_IA_API_KEY:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  activemq-data:
